<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Pro Academy | إدارة المركز</title>
<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);--bg:#f5f6fa;--card:#fff;--tx:#1b2333;--mu:#6b7488;--pr:#1f5eff;--bd:#e2e5ee;--ok:#12805c;--bad:#c2362b;--warn:#a86400}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0f131b;--card:#181d28;--tx:#e8ebf2;--mu:#8f99ad;--pr:#6c93ff;--bd:#2a3140;--ok:#3ecf9b;--bad:#ff7b70;--warn:#f0b24a}}
:root[data-theme="dark"]{--bg:#0f131b;--card:#181d28;--tx:#e8ebf2;--mu:#8f99ad;--pr:#6c93ff;--bd:#2a3140;--ok:#3ecf9b;--bad:#ff7b70;--warn:#f0b24a}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font-family:"Segoe UI",Tahoma,"Noto Sans Arabic",Arial,sans-serif;font-size:15px;line-height:1.6}
header{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:14px 16px;background:linear-gradient(135deg,#0f3fd9,#7a3cff);color:#fff;box-shadow:0 4px 18px #1f5eff44}header button{background:#ffffff26;color:#fff;border-color:#ffffff55}
header b{font-size:19px}header small{color:#ffffffcc}
nav{display:flex;gap:6px;overflow-x:auto;padding:10px 14px}
nav button{white-space:nowrap}
main{padding:0 14px 40px;max-width:900px;margin:auto}
.card{background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:12px;margin:10px 0}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:8px}
.stat{background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:10px;text-align:center}
.stat b{display:block;font-size:20px}.stat span{color:var(--mu);font-size:13px}
input,select{width:100%;padding:9px;border:1px solid var(--bd);border-radius:8px;background:var(--bg);color:var(--tx);font:inherit;margin:3px 0 8px}
label{font-size:13px;color:var(--mu)}
button{font:inherit;padding:8px 13px;border:1px solid var(--bd);border-radius:8px;background:var(--card);color:var(--tx);cursor:pointer}
button.p,nav button.on{background:var(--pr);color:#fff;border-color:var(--pr)}
button.d{color:var(--bad)}
.row{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap}
.acts{display:flex;gap:6px;flex-wrap:wrap}
.tag{font-size:12px;padding:2px 8px;border-radius:99px;border:1px solid var(--bd)}
.ok{color:var(--ok)}.bad{color:var(--bad)}.warn{color:var(--warn)}.mu{color:var(--mu)}
.msg{background:var(--card);border:1px solid var(--warn);color:var(--warn);border-radius:10px;padding:8px 12px;margin:10px 0}
.two{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.scroll{overflow-x:auto}table{border-collapse:collapse;width:100%;min-width:420px}th,td{padding:7px;border-bottom:1px solid var(--bd);text-align:right}
@keyframes up{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
@keyframes toast{0%{opacity:0;transform:translate(-50%,12px)}8%,85%{opacity:1;transform:translate(-50%,0)}100%{opacity:0;transform:translate(-50%,12px);visibility:hidden}}
main>*{animation:up .3s ease both}
nav{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg)}
nav button{border-radius:99px;padding:8px 15px}
nav button.on{box-shadow:0 4px 12px #1f5eff55;transform:translateY(-1px)}
button{transition:transform .12s,box-shadow .12s,background .12s;font-weight:600}
button:hover{transform:translateY(-1px);box-shadow:0 4px 12px #0002}
button:active{transform:scale(.96)}
button.p,nav button.on{background:linear-gradient(135deg,#1f5eff,#5b7dff)}
button.p{box-shadow:0 3px 10px #1f5eff44}
button.d:hover{background:#c2362b18}
input:focus,select:focus,textarea:focus{outline:none;border-color:var(--pr);box-shadow:0 0 0 3px #1f5eff26}
.card{transition:.15s;border-inline-start:4px solid var(--pr)}
.card:hover{box-shadow:0 6px 18px #0001;transform:translateY(-1px)}
.stat{border-top:4px solid var(--c,#1f5eff);transition:.15s}.stat:hover{transform:translateY(-2px);box-shadow:0 6px 16px #0001}
.stat::before{display:block;font-size:24px}.stat b{font-size:22px}
.grid .stat:nth-child(1){--c:#1f5eff}.grid .stat:nth-child(1)::before{content:"👥"}
.grid .stat:nth-child(2){--c:#7a3cff}.grid .stat:nth-child(2)::before{content:"📚"}
.grid .stat:nth-child(3){--c:#12805c}.grid .stat:nth-child(3)::before{content:"💰"}
.grid .stat:nth-child(4){--c:#c2362b}.grid .stat:nth-child(4)::before{content:"⏳"}
.grid .stat:nth-child(5){--c:#a86400}.grid .stat:nth-child(5)::before{content:"🧾"}
.grid .stat:nth-child(6){--c:#0d8a9e}.grid .stat:nth-child(6)::before{content:"📈"}
.tag{padding:3px 10px;font-weight:600}.tag.ok{background:#12805c22;border-color:transparent}.tag.warn{background:#a8640022;border-color:transparent}
.hero{display:flex;justify-content:space-between;align-items:center;gap:12px;background:linear-gradient(135deg,#0f3fd9,#7a3cff);color:#fff;border-radius:16px;padding:16px;margin:10px 0}
.hero h2{margin:0;font-size:20px}.hero p{margin:4px 0 0;opacity:.85}
.ring{width:84px;height:84px;border-radius:50%;background:conic-gradient(#fff calc(var(--p)*1%),#ffffff33 0);display:grid;place-items:center;position:relative;flex:none}
.ring::before{content:"";position:absolute;inset:8px;border-radius:50%;background:#3a2fd0}
.ring span{position:relative;font-weight:700}
.msg{position:fixed;left:50%;bottom:calc(16px + env(safe-area-inset-bottom,0px));z-index:20;background:#1b2333;color:#fff;border:0;border-radius:99px;padding:10px 20px;box-shadow:0 8px 24px #0005;animation:toast 3.6s ease both;max-width:92vw}
button[data-act="saveT"]::before,button[data-act="saveC"]::before,button[data-act="addExp"]::before{content:"✚ "}
button[data-act="pay"]::before,button[data-act="tpay"]::before{content:"💵 "}
button[data-act="rcpt"]::before{content:"🧾 "}
button[data-act="edit"]::before{content:"✏️ "}
button[data-act="del"]::before{content:"🗑 "}
button[data-act="acc"]::before{content:"✔ "}
button[data-act="imp"]::before{content:"⬇ "}
button[data-act="backup"]::before{content:"💾 "}
button[data-act="prom"]::before{content:"⬆ "}
button[data-act="unpay"]::before,button[data-act="tun"]::before{content:"↩ "}
button[data-act="wa1"]::before{content:"💬 "}
button[data-act="wa2"]::before{content:"⏰ "}
textarea{width:100%;padding:9px;border:1px solid var(--bd);border-radius:8px;background:var(--bg);color:var(--tx);font:inherit;margin:3px 0 8px}
.fab{position:fixed;inset-inline-start:16px;bottom:calc(18px + env(safe-area-inset-bottom,0px));width:58px;height:58px;border-radius:50%;padding:0;font-size:30px;line-height:1;background:linear-gradient(135deg,#1f5eff,#7a3cff);color:#fff;border:0;box-shadow:0 8px 22px #1f5eff77;z-index:15}
.fab:hover{transform:scale(1.07)}
#qa{display:none}
.ov{position:fixed;inset:0;background:#0009;z-index:30;display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--card);width:100%;max-width:520px;border-radius:18px 18px 0 0;padding:16px 16px calc(16px + env(safe-area-inset-bottom,0px));animation:up .25s ease;max-height:92vh;overflow:auto}
.b1{fill:var(--ok)}.b2{fill:var(--bad)}.b3{fill:var(--pr)}.gl{stroke:var(--bd);stroke-width:1}.ax{fill:var(--mu);font-size:11px}
.hb{height:10px;background:var(--bd);border-radius:99px;overflow:hidden;margin-top:4px}.hb span{display:block;height:100%;background:linear-gradient(90deg,#1f5eff,#7a3cff);border-radius:99px}
.lg{font-size:13px;color:var(--mu);margin:6px 0}.lg i{display:inline-block;width:10px;height:10px;border-radius:3px;margin:0 6px 0 3px}.l1{background:var(--ok)}.l2{background:var(--bad)}
</style>

<body>
<header><div><b>🎓 Pro Academy</b><br><small id="who"></small></div><div class="acts"><button id="exp" style="display:none">تصدير CSV</button><button id="out" style="display:none">خروج</button></div></header>
<nav id="nav"></nav>
<main id="app"><div class="card mu">جاري التحميل…</div></main>
<button id="fab" class="fab" style="display:none" aria-label="تسجيل سريع">＋</button>
<div id="qa"></div>
<script>
(function(){
  function show(t){var a=document.getElementById('app');if(a)a.innerHTML='<div class="card" style="border-inline-start-color:#c2362b"><b style="color:#c2362b">حدثت مشكلة في التحميل</b><p style="word-break:break-all;direction:ltr;text-align:left">'+String(t).replace(/</g,'&lt;')+'</p></div>'}
  window.addEventListener('error',function(e){show((e.message||'خطأ')+(e.filename?' @ '+e.filename.split('/').pop()+':'+e.lineno:''))});
  window.addEventListener('unhandledrejection',function(e){show((e.reason&&e.reason.message)||e.reason)});
  setTimeout(function(){var a=document.getElementById('app');if(a&&a.textContent.trim()==='جاري التحميل…')show('تعذر تحميل مكتبات Firebase من gstatic.com. تأكد من الإنترنت أو أن الموقع غير محجوب، ثم حدّث الصفحة.')},8000);
})();
</script>
<script type="module">
import {initializeApp} from "https://www.gstatic.com/firebasejs/10.14.1/firebase-app.js";
import {getAuth,onAuthStateChanged,signInWithEmailAndPassword,signOut} from "https://www.gstatic.com/firebasejs/10.14.1/firebase-auth.js";
import {getFirestore,collection,doc,addDoc,setDoc,updateDoc,deleteDoc,onSnapshot} from "https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore.js";

/* ===== إعدادات Firebase: عدّلها حسب ملف SETUP.md ===== */
const firebaseConfig={
  apiKey:"AIzaSyBSwtDzIzorJYCOAr--YuPtYO-nrFEjOwA",
  authDomain:"pro-academy-48dca.firebaseapp.com",
  projectId:"pro-academy-48dca",
  appId:"1:474320172121:web:5048788fbe96a9ca86ad48"
};
const MANAGER_EMAIL="mohamedjalalmody@gmail.com"; /* بأحرف صغيرة، ونفس الإيميل في قواعد Firestore */
/* ======================================================= */

let app=null,auth=null,fs=null;
const P=p=>p.split('/');
const COL={trainees:'متدرب',courses:'دورة',expenses:'مصروف',requests:'طلب تسجيل',roles:'موظف'};
function nameOf(p){const q=p.split('/'),a=S[q[0]],x=Array.isArray(a)?a.find(r=>r.id===q[1]):null;return x?(x.name||x.title||q[1]):q[1]}
async function logW(op,p,d,nm){
  try{
    const c=p.split('/')[0];if(!COL[c])return;
    if(op==='set'&&c!=='roles')return;
    let t=op==='delete'?'حذف':op==='add'?'إضافة':op==='set'?'ضبط صلاحية':'تعديل';
    if(d){if(d.paid===true)t='تسجيل دفع';else if(d.paid===false)t='إلغاء دفع';else if(d.tpaid===true)t='صرف أجر مدرب';else if(d.tpaid===false)t='تراجع عن صرف أجر';else if(d.wait===false)t='تفعيل من الانتظار'}
    await addDoc(collection(fs,'logs'),{at:Date.now(),by:S.id||'',txt:t+' — '+COL[c]+': '+nm});
  }catch(e){}
}
const db={
  collection:p=>({add:async d=>{const r=await addDoc(collection(fs,p),d);logW('add',p,d,d.name||d.title||'');return r},onSnapshot:(n,e)=>onSnapshot(collection(fs,p),sn=>n({docs:sn.docs.map(d=>({id:d.id,data:()=>d.data()}))}),e)}),
  doc:p=>({
    set:async d=>{const nm=nameOf(p);await setDoc(doc(fs,...P(p)),d);logW('set',p,d,nm)},
    update:async d=>{const nm=nameOf(p);await updateDoc(doc(fs,...P(p)),d);logW('upd',p,d,nm)},
    delete:async()=>{const nm=nameOf(p);await deleteDoc(doc(fs,...P(p)));logW('delete',p,null,nm)}
  })
};
const dl={save:({filename,data})=>{const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([data],{type:'text/plain;charset=utf-8'}));a.download=filename;document.body.appendChild(a);a.click();a.remove();return Promise.resolve()}};
const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const num=n=>Number(n||0).toLocaleString('en-US');
const ROLE={manager:'مدير',secretary:'سكرتارية',accountant:'محاسب'};
const TABS={manager:['dash','trainees','req','courses','pay','trainers','exp','log','staff'],secretary:['trainees','req','courses'],accountant:['dash','pay','trainers','exp']};
const TL={dash:'التقارير',trainees:'المتدربون',req:'طلبات التسجيل',courses:'الدورات والجدولة',pay:'المدفوعات',trainers:'المدربون',exp:'المصاريف',log:'سجل النشاط',staff:'الموظفون والنسخ'};
const S={courses:[],trainees:[],requests:[],expenses:[],logs:[],logUser:'',wa:{},fc:'',roles:{},join:{},names:{},id:null,name:'',role:null,tab:'',q:'',edit:null,del:null,msg:'',filter:'all',err:''};
let form={};

function bind(path,key){
  db.collection(path).onSnapshot(s=>{
    if(key==='roles'||key==='join'){S[key]={};s.docs.forEach(d=>S[key][d.id]=d.data())}
    else S[key]=s.docs.map(d=>({id:d.id,...d.data()}));
    if(key==='join')resolveNames();
    render();
  },e=>{S.err='تعذر تحميل البيانات ('+path+')';render()});
}
async function resolveNames(){
  if(!user)return;
  const ids=Object.keys(S.join);if(!ids.length)return;
  try{const p=await user.profiles(ids);ids.forEach(i=>S.names[i]=(p[i]&&p[i].name)||'');render()}catch(e){}
}
function computeRole(){S.role=S.owner?'manager':(S.myrole||null)}
function showLogin(){
  $('#nav').innerHTML='';$('#out').style.display='none';$('#exp').style.display='none';
  $('#app').innerHTML=`<div class="card" style="max-width:380px;margin:30px auto"><h3 style="margin-top:0">🔐 تسجيل الدخول</h3><label>الإيميل</label><input id="l_e" type="email" dir="ltr" autocomplete="username"><label>كلمة السر</label><input id="l_p" type="password" dir="ltr" autocomplete="current-password"><button class="p" data-act="login" style="width:100%">دخول</button><p id="l_m" class="bad"></p></div>`;
}
function init(){
  if(firebaseConfig.apiKey.startsWith('ضع')){$('#app').innerHTML='<div class="card warn"><b>لم يتم ضبط Firebase بعد.</b><p>افتح ملف index.html وضع بيانات مشروعك في أعلى السكربت (راجع SETUP.md).</p></div>';return}
  app=initializeApp(firebaseConfig);auth=getAuth(app);fs=getFirestore(app);
  onAuthStateChanged(auth,u=>{
    if(!u){S.role=null;S.myrole=null;showLogin();return}
    const em=(u.email||'').toLowerCase();
    S.id=em;S.name=em;S.owner=em===MANAGER_EMAIL.toLowerCase();
    $('#out').style.display='';
    let bound=false;
    const go=()=>{if(bound)return;bound=true;bind('courses','courses');bind('trainees','trainees');bind('requests','requests');bind('expenses','expenses');if(S.owner){bind('roles','roles');bind('logs','logs')}onSnapshot(doc(fs,'settings','wa'),sn=>{S.wa=sn.exists()?sn.data():{};render()},()=>{})};
    if(S.owner)go();
    else onSnapshot(doc(fs,'roles',em),sn=>{S.myrole=sn.exists()?sn.data().role:null;if(S.myrole)go();render()},()=>{S.myrole=null;render()});
    render();
  });
}
const cname=id=>(S.courses.find(c=>c.id===id)||{}).name||'—';
const cfee=id=>Number((S.courses.find(c=>c.id===id)||{}).fee||0);
const can=t=>(TABS[S.role]||[]).includes(t);

function render(){
  computeRole();
  $('#fab').style.display=(S.role==='manager'||S.role==='secretary')?'':'none';
  $('#who').textContent=(S.name||'')+(S.role?' · '+ROLE[S.role]:'');
  const app=$('#app'),nav=$('#nav');
  if(S.err){app.innerHTML='<div class="card bad">'+esc(S.err)+'</div>';return}
  if(!S.role){nav.innerHTML='';$('#exp').style.display='none';
    app.innerHTML='<div class="card"><b>حسابك غير مفعّل بعد</b><p class="mu">سجلت الدخول بنجاح، لكن المدير لم يحدد دورك. تواصل معه ليضيف إيميلك في قسم الموظفين، ثم حدّث الصفحة.</p></div>';return}
  const tabs=TABS[S.role];if(!tabs.includes(S.tab))S.tab=tabs[0];
  nav.innerHTML=tabs.map(t=>`<button data-tab="${t}" class="${S.tab===t?'on':''}">${({dash:'📊',trainees:'👥',req:'📥',courses:'📅',pay:'💰',trainers:'🧑‍🏫',exp:'🧾',staff:'⚙️',log:'🕵️'})[t]} ${TL[t]}</button>`).join('');
  $('#exp').style.display=(dl&&can('trainees')||dl&&can('pay'))?'':'none';
  const m=S.msg?`<div class="msg">${esc(S.msg)}</div>`:'';
  if(S.msg){clearTimeout(render.t);render.t=setTimeout(()=>{S.msg=''},3600)}
  app.innerHTML=m+({dash:vDash,trainees:vTrainees,req:vReq,courses:vCourses,pay:vPay,trainers:vTrainers,exp:vExp,staff:vStaff,log:vLog}[S.tab])();
}

function vDash(){
  const paid=S.trainees.filter(t=>t.paid),sum=paid.reduce((a,t)=>a+Number(t.amount||0),0);
  const due=S.trainees.filter(t=>!t.paid&&!t.wait).reduce((a,t)=>a+net(t),0),exp=S.expenses.reduce((a,x)=>a+Number(x.amount||0),0),tpd=S.courses.filter(c=>c.tpaid).reduce((a,c)=>a+Number(c.tpay||0),0),pc=(sum+due)?Math.round(sum/(sum+due)*100):0;
  const rows=S.courses.map(c=>{const ts=S.trainees.filter(t=>t.courseId===c.id),pd=ts.filter(t=>t.paid);
    return `<tr><td>${esc(c.name)}</td><td>${ts.length}</td><td class="ok">${num(pd.reduce((a,t)=>a+Number(t.amount||0),0))}</td><td class="bad">${num(ts.filter(t=>!t.paid&&!t.wait).reduce((a,t)=>a+net(t),0))}</td></tr>`}).join('');
  return `<div class="hero"><div><h2>أهلاً ${esc(S.name||'')} 👋</h2><p>${ROLE[S.role]} · ${new Date().toLocaleDateString('ar-LY',{weekday:'long',day:'numeric',month:'long'})}</p><p>نسبة تحصيل الرسوم</p></div><div class="ring" style="--p:${pc}"><span>${pc}%</span></div></div><div class="grid"><div class="stat"><b>${S.trainees.length}</b><span>متدرب</span></div><div class="stat"><b>${S.courses.length}</b><span>دورة</span></div><div class="stat"><b class="ok">${num(sum)}</b><span>المحصّل (د.ل)</span></div><div class="stat"><b class="bad">${num(due)}</b><span>المتبقي (د.ل)</span></div><div class="stat"><b>${num(exp)}</b><span>مصاريف المركز</span></div><div class="stat"><b>${num(sum-exp-tpd)}</b><span>الصافي بعد المصاريف وأجور المدربين</span></div></div>${alerts()}${charts()}
  <div class="card scroll"><table><tr><th>الدورة</th><th>المتدربون</th><th>المحصّل</th><th>المتبقي</th></tr>${rows||'<tr><td colspan="4" class="mu">لا توجد دورات بعد</td></tr>'}</table></div>`;
}

function vTrainees(){
  const e=S.edit&&S.tab==='trainees'?S.trainees.find(t=>t.id===S.edit):null;
  const f=e||form;
  const opts=S.courses.map(c=>`<option value="${c.id}" ${f.courseId===c.id?'selected':''}>${esc(c.name)}</option>`).join('');
  const q=S.q.trim();
  const list=S.trainees.filter(t=>(!q||(t.name+' '+t.phone).includes(q))&&(!S.fc||t.courseId===S.fc)).sort((a,b)=>(b.at||0)-(a.at||0)).map(t=>`<div class="card"><div class="row"><div><b>${esc(t.name)}</b> ${t.wait?'<span class="tag warn">قائمة انتظار</span>':`<span class="tag ${t.paid?'ok':'warn'}">${t.paid?'مدفوع':'غير مدفوع'}</span>`}<br><span class="mu">${esc(t.phone)} · ${esc(t.work)}<br>${esc(cname(t.courseId))}</span></div><div class="acts">${t.wait?`<button class="p" data-act="prom" data-id="${t.id}">تفعيل</button>`:`<button data-act="wa1" data-id="${t.id}">تأكيد</button><button data-act="wa2" data-id="${t.id}">تذكير</button>`}<button data-act="edit" data-id="${t.id}">تعديل</button><button class="d" data-act="del" data-id="${t.id}">${S.del===t.id?'تأكيد الحذف':'حذف'}</button></div></div></div>`).join('');

function svgBars(labels,sets,cls){
  const W=600,H=220,pl=46,pr=8,pt=20,pb=26,iw=W-pl-pr,ih=H-pt-pb;
  const max=Math.max(1,...sets.flat()),m=Math.pow(10,Math.floor(Math.log10(max))),top=Math.ceil(max/m)*m;
  const sh=v=>v>=1000?(v/1000).toFixed(v>=10000?0:1)+'k':String(Math.round(v));
  const slot=iw/labels.length,bw=Math.min(24,slot/(sets.length+1));
  let g='';
  [0,.5,1].forEach(f=>{const y=pt+ih-f*ih;g+=`<line x1="${pl}" x2="${W-pr}" y1="${y}" y2="${y}" class="gl"/><text x="${pl-5}" y="${y+4}" text-anchor="end" class="ax">${sh(top*f)}</text>`});
  labels.forEach((lb,i)=>{
    const cx=W-pr-(i+.5)*slot;
    g+=`<text x="${cx}" y="${H-8}" text-anchor="middle" class="ax">${esc(lb)}</text>`;
    sets.forEach((st,k)=>{
      const v=st[i],h=v/top*ih,x=cx-sets.length*bw/2+k*bw;
      g+=`<rect x="${x}" y="${pt+ih-h}" width="${bw-2}" height="${Math.max(h,0)}" rx="3" class="${cls[k]}"/>`;
      if(v>0)g+=`<text x="${x+(bw-2)/2}" y="${pt+ih-h-4}" text-anchor="middle" class="ax">${sh(v)}</text>`;
    });
  });
  return `<div class="scroll"><svg viewBox="0 0 ${W} ${H}" style="width:100%;min-width:420px;direction:ltr">${g}</svg></div>`;
}
function charts(){
  const now=new Date(),ms=[];
  for(let i=5;i>=0;i--){const d=new Date(now.getFullYear(),now.getMonth()-i,1);ms.push({k:d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0'),l:d.toLocaleDateString('ar-LY',{month:'short'})})}
  const key=t=>{const d=new Date(t);return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')};
  const agg=(arr,tf,vf)=>ms.map(m=>arr.reduce((a,x)=>a+(tf(x)&&key(tf(x))===m.k?vf(x):0),0));
  const rev=agg(S.trainees.filter(t=>t.paid),t=>t.paidAt,t=>Number(t.amount||0));
  const exp=agg(S.expenses,x=>x.at,x=>Number(x.amount||0));
  const reg=agg(S.trainees,t=>t.at,()=>1);
  const labels=ms.map(m=>m.l);
  const mx=Math.max(1,...S.courses.map(c=>Math.max(cnt(c.id)+wc(c.id),c.seats||0)));
  const rows=S.courses.map(c=>{const n=cnt(c.id),w=wc(c.id),cap=c.seats||0;return `<div style="margin:8px 0"><div class="row"><span>${esc(c.name)}</span><span class="mu">${n}${cap?' / '+cap:''}${w?' · انتظار '+w:''}</span></div><div class="hb"><span style="width:${Math.round(n/mx*100)}%"></span></div></div>`}).join('')||'<span class="mu">لا توجد دورات</span>';
  return `<div class="card"><b>الإيرادات والمصاريف (آخر 6 أشهر)</b><div class="lg"><i class="l1"></i>إيرادات<i class="l2"></i>مصاريف</div>${svgBars(labels,[rev,exp],['b1','b2'])}</div><div class="card"><b>التسجيلات الجديدة شهريًا</b>${svgBars(labels,[reg],['b3'])}</div><div class="card"><b>المتدربون في كل دورة</b>${rows}</div>`;
}

  if(a==='tpay')return w(()=>db.doc('courses/'+id).update({tpaid:true}),'تم تسجيل صرف أجر المدرب');
  if(a==='tun')return w(()=>db.doc('courses/'+id).update({tpaid:false}),'تم التراجع');
  if(a==='addExp'){const ti=$('#x_t').value.trim(),am=Number($('#x_a').value||0);if(!ti||!am){S.msg='البيان والمبلغ مطلوبان';return render()}return w(()=>db.collection('expenses').add({title:ti,amount:am,at:Date.now()}),'تمت إضافة المصروف')}
  if(a==='backup'){const o={courses:S.courses,trainees:S.trainees,expenses:S.expenses,requests:S.requests,at:Date.now()};return dl&&dl.save({filename:'pro-academy-backup.json',data:JSON.stringify(o)}).catch(()=>{})}
  if(a==='rcpt'){const t=S.trainees.find(x=>x.id===id);if(!dl)return;const h=`<!DOCTYPE html><html lang="ar" dir="rtl"><meta charset="utf-8"><title>إيصال</title><body style="font-family:Tahoma,Arial;max-width:480px;margin:30px auto;border:2px solid #1f5eff;padding:24px"><h2 style="text-align:center;margin:0">Pro Academy</h2><p style="text-align:center;margin:4px 0 18px">إيصال استلام رسوم</p><p>رقم الإيصال: <b>${esc(t.receipt)}</b></p><p>التاريخ: <b>${new Date(t.paidAt||Date.now()).toLocaleDateString('en-GB')}</b></p><p>استلمنا من: <b>${esc(t.name)}</b></p><p>عن دورة: <b>${esc(cname(t.courseId))}</b></p><p>المبلغ: <b>${num(t.amount)} دينار ليبي</b>${t.disc?' (بعد خصم '+num(t.disc)+')':''}</p><p style="margin-top:40px">توقيع المحاسب: ____________ &nbsp;&nbsp;&nbsp; الختم</p></body>`;return dl.save({filename:'receipt-'+t.receipt+'.html',data:h}).catch(()=>{})}
  if(a==='imp'){
    const ex=new Set([...S.requests,...S.trainees].map(x=>(x.phone||'').replace(/\D/g,'')));
    const rows=$('#imp').value.split('\n').map(l=>l.split(l.includes('\t')?'\t':',').map(x=>x.trim().replace(/^"|"$/g,''))).filter(r=>r.length>=3&&r.join('').trim());
    const jobs=[];
    rows.forEach(r=>{if(/timestamp|الطابع/i.test(r[0]))return;if(r.length>=5)r=r.slice(1);const ph=(r[1]||'').replace(/\D/g,'');if(!r[0]||(ph&&ex.has(ph)))return;ex.add(ph);jobs.push({name:r[0],phone:r[1]||'',work:r[2]||'',course:r[3]||'',at:Date.now()+jobs.length})});
    return w(async()=>{for(const j of jobs)await db.collection('requests').add(j)},'تم استيراد '+jobs.length+' طلب جديد (المكرر تم تجاوزه)');
  }
  if(a==='acc'){const r=S.requests.find(x=>x.id===id),cid=$('#rq_'+id).value;if(!cid){S.msg='اختر الدورة أولاً';return render()}return w(async()=>{await db.collection('trainees').add({name:r.name,phone:r.phone,work:r.work,courseId:cid,paid:false,wait:full(cid),at:Date.now()});await db.doc('requests/'+id).delete()},'تم قبول الطلب')}
  if(a==='wa1'||a==='wa2'){
    const t=S.trainees.find(x=>x.id===id),c=S.courses.find(x=>x.id===t.courseId)||{};
    const tpl=a==='wa1'?(S.wa.confirm||DEF.confirm):(S.wa.remind||DEF.remind);
    const ph=waNum(t.phone);
    if(!ph){S.msg='رقم هاتف المتدرب غير صالح';return render()}
    window.open('https://wa.me/'+ph+'?text='+encodeURIComponent(fill(tpl,t,c)),'_blank');
    try{addDoc(collection(fs,'logs'),{at:Date.now(),by:S.id||'',txt:'تجهيز رسالة واتساب ('+(a==='wa1'?'تأكيد تسجيل':'تذكير ببداية الدورة')+') — متدرب: '+t.name})}catch(e){}
    return;
  }
  if(a==='saveWa')return w(()=>db.doc('settings/wa').set({confirm:$('#w_c').value,remind:$('#w_r').value}),'تم حفظ القوالب');
  if(a==='resetWa')return w(()=>db.doc('settings/wa').set({}),'تمت استعادة القوالب الافتراضية');
  if(a==='login'){const em=$('#l_e').value.trim(),pw=$('#l_p').value;$('#l_m').textContent='';return signInWithEmailAndPassword(auth,em,pw).catch(()=>{$('#l_m').textContent='الإيميل أو كلمة السر غير صحيحة'})}
  if(a==='addStaff'){const em=$('#s_e').value.trim().toLowerCase();if(!/^\S+@\S+\.\S+$/.test(em)){S.msg='اكتب إيميل صحيح';return render()}return w(()=>db.doc('roles/'+em).set({role:$('#s_r').value}),'تمت إضافة الموظف')}
  if(a==='rmstaff'){if(S.del!==id){S.del=id;return render()}S.del=null;return w(()=>db.doc('roles/'+id).delete(),'تم حذف الموظف')}
  if(a==='saveT'){
    const d={name:$('#f_name').value.trim(),phone:$('#f_phone').value.trim(),work:$('#f_work').value.trim(),courseId:$('#f_course').value,disc:Number($('#f_disc').value||0)};
    if(!d.name||!d.courseId){S.msg='الاسم والدورة مطلوبان';form=d;return render()}
    const ed=S.edit;S.edit=null;form={};
    return w(()=>ed?db.doc('trainees/'+ed).update(d):db.collection('trainees').add({...d,paid:false,wait:full(d.courseId),at:Date.now()}),'تم الحفظ');
  }
  if(a==='saveC'){
    const g=k=>$('#c_'+k).value.trim();
    const d={name:g('name'),fee:Number(g('fee')||0),seats:Number(g('seats')||0),tpay:Number(g('tpay')||0),hall:g('hall'),trainer:g('trainer'),start:g('start'),end:g('end'),from:g('from'),to:g('to')};
    form=d;
    if(!d.name){S.msg='اسم الدورة مطلوب';return render()}
    const clash=S.courses.find(c=>c.id!==S.edit&&overlap(c.start,c.end,d.start,d.end)&&overlap(c.from,c.to,d.from,d.to)&&((d.hall&&c.hall===d.hall)||(d.trainer&&c.trainer===d.trainer)));
    if(clash){S.msg='تعارض مع دورة «'+clash.name+'»: نفس القاعة أو المدرب في نفس الوقت';return render()}
    const ed=S.edit;S.edit=null;form={};
    return w(()=>ed?db.doc('courses/'+ed).update(d):db.collection('courses').add(d),'تم الحفظ');
  }
});

async function exportCsv(){
  if(!dl)return;
  const q=v=>'"'+String(v??'').replace(/"/g,'""')+'"';
  const rows=[['الاسم','الهاتف','المؤهل/العمل','الدورة','الرسوم','الحالة','المبلغ المدفوع','رقم الإيصال'].map(q).join(',')];
  S.trainees.forEach(t=>rows.push([t.name,t.phone,t.work,cname(t.courseId),cfee(t.courseId),t.paid?'مدفوع':'غير مدفوع',t.amount||0,t.receipt||''].map(q).join(',')));
  try{await dl.save({filename:'pro-academy-trainees.csv',data:'\ufeff'+rows.join('\n')})}catch(e){}
}
document.addEventListener('change',e=>{if(e.target.id==='lg_u'){S.logUser=e.target.value;render()}if(e.target.id==='fc'){S.fc=e.target.value;render()}});
document.addEventListener('change',async e=>{if(e.target.id!=='rf'||!e.target.files[0])return;
  try{const o=JSON.parse(await e.target.files[0].text());let n=0;
    for(const k of['courses','trainees','expenses','requests'])for(const x of(o[k]||[])){const{id,...d}=x;await db.doc(k+'/'+id).set(d);n++}
    S.msg='تم استرجاع '+n+' سجل'}catch(err){S.msg='ملف النسخة غير صالح أو فشل الاسترجاع'}render()});
document.addEventListener('keydown',e=>{if(e.key==='Enter'&&(e.target.id==='l_p'||e.target.id==='l_e')){const b=document.querySelector('[data-act=login]');b&&b.click()}});
$('#qa').addEventListener('click',e=>{if(e.target.classList.contains('ov'))closeQA()});
init();
</script>
